appId: dev.clicky.desktop
productName: Clicky
# The workspace package name (@clicky/desktop) would otherwise become the install folder name.
extraMetadata:
  name: clicky
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - '**/*.node'
  # The local speech engine loads its DLLs from its own folder.
  - '**/node_modules/sherpa-onnx-win-x64/**'
win:
  target: nsis
  icon: resources/icon.png
  # Keep icon/name editing of Clicky.exe; there is no code-signing certificate (personal build).
  signExecutable: false
nsis:
  # A short, styled installer (welcome, progress, finish) with Clicky's own art.
  oneClick: false
  allowToChangeInstallationDirectory: false
  installerSidebar: resources/installerSidebar.bmp
  uninstallerSidebar: resources/installerSidebar.bmp
  installerHeader: resources/installerHeader.bmp
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Clicky
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: Clicky-Setup-${version}.${ext}
