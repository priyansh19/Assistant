<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Clicky task</title>
    <style>
      :root {
        --accent: #2f8cff;
        --amber: #f5a524;
        --red: #ff453a;
        --ink: #f5f5f7;
        --dim: rgba(245, 245, 247, 0.62);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font:
          13px 'Segoe UI Variable Text',
          'Segoe UI',
          system-ui,
          sans-serif;
        color: var(--ink);
        user-select: none;
        overflow: hidden;
      }
      /* A notch hanging from the top edge: pure black like the screen bezel, soft round bottom. */
      .notch {
        position: relative;
        box-sizing: border-box;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px 0 12px;
        background: #000;
        border-radius: 0 0 22px 22px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.45),
          inset 0 -1px 0 rgba(255, 255, 255, 0.07);
        overflow: hidden;
        animation: drop 260ms cubic-bezier(0.2, 0.9, 0.25, 1.15);
      }
      @keyframes drop {
        from {
          transform: translateY(-100%) scaleX(0.6);
        }
        to {
          transform: none;
        }
      }
      /* A thin light that travels along the bottom edge while Clicky works. */
      .notch::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        background-size: 40% 100%;
        background-repeat: no-repeat;
        animation: sweep 1.6s ease-in-out infinite;
        opacity: 0.85;
      }
      .paused::after {
        animation: none;
        opacity: 0;
      }
      .asking::after {
        background-image: linear-gradient(90deg, transparent, var(--amber), transparent);
      }
      @keyframes sweep {
        from {
          background-position: -40% 0;
        }
        to {
          background-position: 140% 0;
        }
      }
      .badge {
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--accent) 18%, transparent);
      }
      .mark {
        width: 13px;
        height: 13px;
        animation: spin 1.4s linear infinite;
      }
      .paused .mark {
        animation: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .mark path {
        fill: var(--accent);
      }
      .asking .badge {
        background: color-mix(in srgb, var(--amber) 22%, transparent);
      }
      .asking .mark path {
        fill: var(--amber);
      }
      .text {
        flex: 1;
        min-width: 0;
        line-height: 1.3;
      }
      .goal,
      .now {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .goal {
        font-weight: 600;
        letter-spacing: 0.1px;
      }
      .now {
        color: var(--dim);
        font-size: 12px;
        animation: fade 220ms ease-out;
      }
      .asking .now {
        color: #ffd28a;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
      }
      .step {
        flex: none;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--dim);
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
      }
      button {
        flex: none;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.1);
        border: none;
        border-radius: 999px;
        height: 28px;
        padding: 0 12px;
        cursor: pointer;
        transition:
          background 120ms,
          transform 120ms;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.18);
      }
      button:active {
        transform: scale(0.95);
      }
      button.icon {
        width: 28px;
        padding: 0;
        display: grid;
        place-items: center;
      }
      button.icon svg {
        width: 12px;
        height: 12px;
        fill: currentColor;
      }
      button.stop {
        color: #ff8a80;
      }
      button.allow {
        background: var(--amber);
        color: #1a1200;
      }
      button.allow:hover {
        background: #ffb84d;
      }
      /* Allow all: a red outline until it's on, then solid red. */
      button.all {
        background: transparent;
        color: var(--red);
        box-shadow: inset 0 0 0 1.5px var(--red);
      }
      button.all:hover {
        background: rgba(255, 69, 58, 0.14);
      }
      button.all.on {
        background: var(--red);
        color: #fff;
        box-shadow: 0 0 12px rgba(255, 69, 58, 0.55);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="notch" id="strip">
      <div class="badge">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12 L6 20.7 L6 3.3 Z" /></svg>
      </div>
      <div class="text">
        <div class="goal" id="goal">Working…</div>
        <div class="now" id="now"></div>
      </div>
      <span class="step" id="step" hidden></span>
      <button class="allow" id="allow" hidden>Allow</button>
      <button class="all" id="all" title="Run every step without asking, until you turn it off">Allow all</button>
      <button class="icon" id="pause" title="Pause">
        <svg viewBox="0 0 12 12" id="pauseIcon">
          <rect x="2" y="1.5" width="3" height="9" rx="1" />
          <rect x="7" y="1.5" width="3" height="9" rx="1" />
        </svg>
      </button>
      <button class="icon stop" id="stop" title="Stop (Esc)">
        <svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5" /></svg>
      </button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
