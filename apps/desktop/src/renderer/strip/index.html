<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Clicky task</title>
    <style>
      :root {
        --accent: #2f8cff;
        --amber: #f59e0b;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font:
          13px 'Segoe UI Variable Text',
          'Segoe UI',
          system-ui,
          sans-serif;
        color: #fafafa;
        user-select: none;
        overflow: hidden;
      }
      .strip {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px 0 12px;
        background: rgba(14, 15, 18, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
      }
      .strip.asking {
        border-color: var(--amber);
      }
      .mark {
        flex: none;
        width: 14px;
        height: 14px;
      }
      .mark path {
        fill: var(--accent);
      }
      .asking .mark path {
        fill: var(--amber);
      }
      .text {
        flex: 1;
        min-width: 0;
        line-height: 1.3;
      }
      .goal {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 600;
      }
      .now {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: rgba(250, 250, 250, 0.7);
        font-size: 12px;
      }
      button {
        font: inherit;
        color: #fafafa;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.16);
      }
      button.allow {
        background: var(--amber);
        border-color: var(--amber);
        color: #111;
        font-weight: 600;
      }
      button.stop {
        border-color: rgba(255, 120, 100, 0.6);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="strip" id="strip">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12 L6 20.7 L6 3.3 Z" /></svg>
      <div class="text">
        <div class="goal" id="goal">Working…</div>
        <div class="now" id="now"></div>
      </div>
      <button class="allow" id="allow" hidden>Allow</button>
      <button id="pause">Pause</button>
      <button class="stop" id="stop" title="Esc also stops it">Stop</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
