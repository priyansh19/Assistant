<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Clicky: allow all is on</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font:
          12px 'Segoe UI Variable Text',
          'Segoe UI',
          system-ui,
          sans-serif;
        color: #f5f5f7;
      }
      /* About 3.5 mm across, translucent red, breathing. */
      .orb {
        position: absolute;
        right: 4px;
        top: 50%;
        width: 13px;
        height: 13px;
        margin-top: -6.5px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ff8a80, #ff3b30 60%);
        opacity: 0.6;
        cursor: pointer;
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.55);
          transform: scale(1);
        }
        50% {
          box-shadow: 0 0 0 7px rgba(255, 59, 48, 0);
          transform: scale(1.12);
        }
      }
      /* The card that opens on hover, to the left of the orb. */
      .card {
        position: absolute;
        right: 24px;
        top: 50%;
        transform: translateY(-50%) scale(0.92);
        transform-origin: right center;
        width: 200px;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(12, 12, 14, 0.94);
        box-shadow:
          0 10px 28px rgba(0, 0, 0, 0.45),
          inset 0 0 0 1px rgba(255, 69, 58, 0.35);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 140ms,
          transform 140ms;
      }
      .open .card {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(-50%) scale(1);
      }
      .open .orb {
        opacity: 0.95;
      }
      .title {
        font-weight: 600;
        margin-bottom: 2px;
      }
      .sub {
        color: rgba(245, 245, 247, 0.62);
        margin-bottom: 8px;
        line-height: 1.3;
      }
      button {
        font: inherit;
        font-weight: 600;
        width: 100%;
        height: 26px;
        border: none;
        border-radius: 999px;
        background: #ff453a;
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #ff6259;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="card" id="card">
        <div class="title">Allow all is on</div>
        <div class="sub">Clicky runs every step without asking.</div>
        <button id="off">Turn off</button>
      </div>
      <div class="orb" id="orb" title="Allow all is on"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
