<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Clicky: allow all is on</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font:
          12px 'Segoe UI Variable Text',
          'Segoe UI',
          system-ui,
          sans-serif;
        color: #fff;
      }
      /*
       * One shape that lives two lives: a small breathing orb that keeps changing shape, and, on
       * hover, the same shape stretched into a little window that asks to turn Allow all off.
       */
      .orb {
        position: absolute;
        right: 6px;
        top: 50%;
        width: 14px;
        height: 14px;
        transform: translateY(-50%);
        border-radius: 50%;
        background:
          radial-gradient(circle at 32% 30%, rgba(255, 210, 200, 0.95), transparent 38%),
          radial-gradient(circle at 70% 75%, rgba(140, 0, 20, 0.9), transparent 55%),
          radial-gradient(circle at 50% 50%, #ff4d3d, #d1121b 70%);
        background-size:
          100% 100%,
          100% 100%,
          100% 100%;
        opacity: 0.6;
        box-shadow:
          0 0 10px 2px rgba(255, 59, 48, 0.55),
          0 0 22px 6px rgba(255, 59, 48, 0.25);
        animation:
          morph 3.2s ease-in-out infinite,
          breathe 2.1s ease-in-out infinite,
          swirl 5s linear infinite;
        overflow: hidden;
        cursor: pointer;
        transition:
          width 320ms cubic-bezier(0.2, 0.9, 0.25, 1.1),
          height 320ms cubic-bezier(0.2, 0.9, 0.25, 1.1),
          border-radius 320ms ease,
          opacity 200ms,
          background 300ms;
      }
      /* The shape never settles: it wobbles like something alive. */
      @keyframes morph {
        0%,
        100% {
          border-radius: 50% 50% 50% 50% / 50% 50% 50% 50%;
        }
        25% {
          border-radius: 58% 42% 55% 45% / 45% 58% 42% 55%;
        }
        50% {
          border-radius: 45% 55% 40% 60% / 60% 42% 58% 40%;
        }
        75% {
          border-radius: 55% 45% 60% 40% / 42% 55% 45% 58%;
        }
      }
      @keyframes breathe {
        0%,
        100% {
          box-shadow:
            0 0 8px 1px rgba(255, 59, 48, 0.5),
            0 0 18px 4px rgba(255, 59, 48, 0.18);
          scale: 1;
        }
        50% {
          box-shadow:
            0 0 14px 4px rgba(255, 59, 48, 0.75),
            0 0 30px 10px rgba(255, 59, 48, 0.3);
          scale: 1.18;
        }
      }
      /* The light inside drifts around, so it never looks like a flat dot. */
      @keyframes swirl {
        0% {
          background-position:
            0 0,
            0 0,
            0 0;
        }
        50% {
          background-position:
            3px 2px,
            -2px -3px,
            0 0;
        }
        100% {
          background-position:
            0 0,
            0 0,
            0 0;
        }
      }
      /* Hovered: the orb stretches into a small window. */
      .open .orb {
        width: 224px;
        height: 76px;
        border-radius: 22px;
        opacity: 1;
        cursor: default;
        animation: breathe 2.1s ease-in-out infinite;
        scale: 1;
        background:
          radial-gradient(circle at 92% 50%, rgba(255, 77, 61, 0.55), transparent 30%),
          linear-gradient(135deg, rgba(40, 6, 8, 0.97), rgba(18, 6, 8, 0.97));
      }
      .body {
        position: absolute;
        inset: 0;
        padding: 10px 14px 10px 14px;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        align-items: center;
        column-gap: 10px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 160ms;
      }
      .open .body {
        opacity: 1;
        pointer-events: auto;
        transition-delay: 160ms;
      }
      .title {
        font-weight: 600;
        font-size: 12.5px;
        white-space: nowrap;
      }
      .sub {
        grid-column: 1;
        color: rgba(255, 220, 215, 0.72);
        font-size: 11px;
        line-height: 1.3;
      }
      button {
        grid-row: 1 / 3;
        grid-column: 2;
        font: inherit;
        font-weight: 600;
        height: 30px;
        padding: 0 14px;
        border: none;
        border-radius: 999px;
        background: #ff453a;
        color: #fff;
        cursor: pointer;
        box-shadow: 0 0 14px rgba(255, 69, 58, 0.6);
      }
      button:hover {
        background: #ff6259;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="orb" id="orb" title="Allow all is on">
        <div class="body" id="card">
          <div class="title">Allow all is on</div>
          <button id="off">Turn off</button>
          <div class="sub">Clicky acts without asking. That's risky.</div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
