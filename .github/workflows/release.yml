name: Release

# Builds the Windows, macOS and Linux installers and attaches them to a DRAFT GitHub release.
# Nothing runs on merges or pushes to master. Start it only on purpose, one of two ways:
#   - push a version tag:     git tag v0.2.0 && git push origin v0.2.0
#   - or run it by hand:      Actions > Release > Run workflow, with a version like 0.2.0
# The release stays a draft until someone tests the installers and presses Publish on GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the v (for example 0.2.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            flags: --win nsis --x64
            files: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.exe.blockmap
          - name: macos
            os: macos-latest
            flags: --mac dmg --arm64
            files: apps/desktop/release/*.dmg
          - name: linux
            os: ubuntu-latest
            flags: --linux AppImage deb --x64
            files: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificates exist yet. The Mac app is ad-hoc signed (identity '-' in
      # electron-builder.yml); stop electron-builder looking for a keychain identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Work out the version
        id: version
        shell: bash
        run: |
          v="${{ inputs.version }}"
          [ -z "$v" ] && v="${GITHUB_REF_NAME#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$v' is not a version like 1.2.3"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Linux build libraries for the key hook
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxt-dev libxkbfile-dev libxrandr-dev libxinerama-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Bundle the built-in AI, speech model and voices
        working-directory: apps/desktop
        run: node scripts/fetch-bundle.mjs
      - name: Build installer
        working-directory: apps/desktop
        run: >
          pnpm exec electron-vite build &&
          pnpm exec electron-builder ${{ matrix.flags }} --publish never
          -c.extraMetadata.version=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: clicky-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release with every installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ inputs.version }}"
          [ -z "$v" ] && v="${GITHUB_REF_NAME#v}"
          tag="v$v"
          sed "s/{{VERSION}}/$v/g" .github/release-notes.md > notes.md
          ls -la dist
          # A manual run creates the tag on the commit it built from.
          gh release create "$tag" dist/* --draft --title "Clicky $v" --notes-file notes.md --target "$GITHUB_SHA"
