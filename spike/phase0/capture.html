<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; media-src 'self' blob: mediastream:">
</head><body>
<script>
// Warm-stream capture: open a desktop media stream once, then grab frames on demand.
window.spike.on('capture-start', async ({ sourceId, width, height }) => {
  const r = {};
  try {
    const t0 = performance.now();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { mandatory: {
      chromeMediaSource: 'desktop', chromeMediaSourceId: sourceId,
      maxWidth: width, maxHeight: height, minWidth: width, minHeight: height, maxFrameRate: 30 } } });
    const track = stream.getVideoTracks()[0];
    r.openMs = +(performance.now() - t0).toFixed(1);
    r.settings = track.getSettings();
    const video = document.createElement('video');
    video.srcObject = stream; video.muted = true; await video.play();
    r.firstFrameMs = +(performance.now() - t0).toFixed(1);
    const canvas = new OffscreenCanvas(video.videoWidth, video.videoHeight);
    const ctx = canvas.getContext('2d');
    const s = 1280 / Math.max(video.videoWidth, video.videoHeight);
    const small = new OffscreenCanvas(Math.round(video.videoWidth * s), Math.round(video.videoHeight * s));
    const sctx = small.getContext('2d');
    const grabs = [];
    for (let i = 0; i < 8; i++) {
      const g0 = performance.now();
      ctx.drawImage(video, 0, 0);
      const g1 = performance.now();
      const blob = await canvas.convertToBlob({ type: 'image/jpeg', quality: 0.8 });
      const g2 = performance.now();
      sctx.drawImage(video, 0, 0, small.width, small.height);
      const sb = await small.convertToBlob({ type: 'image/jpeg', quality: 0.8 });
      const g3 = performance.now();
      grabs.push({ drawMs: +(g1 - g0).toFixed(1), jpegNativeMs: +(g2 - g1).toFixed(1), bytesNative: blob.size,
        drawAndJpeg1280Ms: +(g3 - g2).toFixed(1), bytes1280: sb.size, size: [video.videoWidth, video.videoHeight] });
      await new Promise((res) => setTimeout(res, 100));
    }
    r.grabs = grabs;
    track.stop();
  } catch (e) { r.error = String(e); }
  window.spike.send('capture-result', r);
});
</script></body></html>
